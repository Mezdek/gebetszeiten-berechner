<!doctype html>
<html lang="de" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gebetszeiten-Berechner</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 data-i18n="appTitle"></h1>
        <div class="header-controls">
          <button type="button" id="about-btn" class="about-btn" data-i18n="aboutButton"></button>
          <select id="lang-select" class="lang-select" data-i18n-aria-label="langSwitcherLabel">
            <option value="de">Deutsch</option>
            <option value="ar">العربية</option>
          </select>
        </div>
      </header>

      <div id="status-banner" class="banner" hidden role="status"></div>

      <form id="config-form" novalidate>
        <fieldset class="section">
          <legend data-i18n="sectionLocation"></legend>

          <div class="field">
            <label id="latitude-group-label" data-i18n="fieldLatitude"></label>
            <div class="dms-group" role="group" aria-labelledby="latitude-group-label">
              <span class="dms-part">
                <input type="number" id="latitude-degrees" step="1" min="0" max="90" required />
                <span class="dms-unit" data-i18n="dmsDegreesUnit"></span>
              </span>
              <span class="dms-part">
                <input type="number" id="latitude-minutes" step="1" min="0" max="59" required />
                <span class="dms-unit" data-i18n="dmsMinutesUnit"></span>
              </span>
              <span class="dms-part">
                <input type="number" id="latitude-seconds" step="any" min="0" max="59.999" required />
                <span class="dms-unit" data-i18n="dmsSecondsUnit"></span>
              </span>
              <select id="latitude-direction">
                <option value="N" data-i18n="directionNorth"></option>
                <option value="S" data-i18n="directionSouth"></option>
              </select>
            </div>
            <p class="field-error" id="latitude-error" hidden></p>
          </div>

          <div class="field">
            <label id="longitude-group-label" data-i18n="fieldLongitude"></label>
            <div class="dms-group" role="group" aria-labelledby="longitude-group-label">
              <span class="dms-part">
                <input type="number" id="longitude-degrees" step="1" min="0" max="180" required />
                <span class="dms-unit" data-i18n="dmsDegreesUnit"></span>
              </span>
              <span class="dms-part">
                <input type="number" id="longitude-minutes" step="1" min="0" max="59" required />
                <span class="dms-unit" data-i18n="dmsMinutesUnit"></span>
              </span>
              <span class="dms-part">
                <input type="number" id="longitude-seconds" step="any" min="0" max="59.999" required />
                <span class="dms-unit" data-i18n="dmsSecondsUnit"></span>
              </span>
              <select id="longitude-direction">
                <option value="E" data-i18n="directionEast"></option>
                <option value="W" data-i18n="directionWest"></option>
              </select>
            </div>
            <p class="field-error" id="longitude-error" hidden></p>
          </div>

          <div class="field">
            <label for="elevation" data-i18n="fieldElevation"></label>
            <input type="number" id="elevation" name="elevation" step="any" />
            <p class="field-hint" data-i18n="fieldElevationHint"></p>
            <p class="field-error" id="elevation-error" hidden></p>
          </div>

          <div class="field">
            <label for="timezone" data-i18n="fieldTimezone"></label>
            <input type="text" id="timezone" name="timezone" required placeholder="Europe/Berlin" />
            <p class="field-hint" data-i18n="fieldTimezoneHint"></p>
            <p class="field-error" id="timezone-error" hidden></p>
          </div>
        </fieldset>

        <fieldset class="section">
          <legend data-i18n="sectionCalculation"></legend>

          <div class="field">
            <label for="fajr-angle" data-i18n="fieldFajrAngle"></label>
            <input type="number" id="fajr-angle" name="fajrAngle" step="any" required />
            <p class="field-error" id="fajr-angle-error" hidden></p>
          </div>

          <div class="field">
            <label for="isha-angle" data-i18n="fieldIshaAngle"></label>
            <input type="number" id="isha-angle" name="ishaAngle" step="any" required />
            <p class="field-error" id="isha-angle-error" hidden></p>
          </div>

          <fieldset class="field">
            <legend data-i18n="fieldAsrMethod"></legend>
            <label class="radio-label">
              <input type="radio" name="asrMethod" value="1" id="asr-method-1" checked />
              <span data-i18n="asrMethodShafii"></span>
            </label>
            <label class="radio-label">
              <input type="radio" name="asrMethod" value="2" id="asr-method-2" />
              <span data-i18n="asrMethodHanafi"></span>
            </label>
          </fieldset>
        </fieldset>

        <fieldset class="section">
          <legend data-i18n="sectionAdjustments"></legend>

          <div class="rounding-table" id="rounding-table" role="table">
            <div id="rounding-table-body" role="rowgroup"></div>
          </div>

          <div class="field">
            <label for="hijri-offset" data-i18n="fieldHijriOffset"></label>
            <input type="number" id="hijri-offset" name="hijriOffsetDays" step="1" value="0" />
            <p class="field-hint" data-i18n="fieldHijriOffsetHint"></p>
            <p class="field-error" id="hijri-offset-error" hidden></p>
          </div>
        </fieldset>

        <fieldset class="section">
          <legend data-i18n="sectionOutput"></legend>

          <div class="field">
            <label for="year" data-i18n="fieldYear"></label>
            <input type="number" id="year" name="year" step="1" required />
            <p class="field-error" id="year-error" hidden></p>
          </div>

          <div class="field">
            <label for="generator" data-i18n="fieldGenerator"></label>
            <input type="text" id="generator" name="generator" required />
            <p class="field-error" id="generator-error" hidden></p>
          </div>

          <div class="field">
            <label class="checkbox-label">
              <input type="checkbox" id="validate-schema" name="validateSchema" />
              <span data-i18n="fieldValidateSchema"></span>
            </label>
            <p class="field-hint" data-i18n="fieldValidateSchemaHint"></p>
          </div>

          <div class="field">
            <p class="meta-fields-label" data-i18n="fieldMetaFields"></p>
            <div id="meta-fields-list"></div>
            <button type="button" id="add-meta-field-btn" data-i18n="addMetaField"></button>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit" id="generate-btn" data-i18n="generateButton"></button>
          <button type="button" id="export-btn" data-i18n="exportConfig"></button>
          <button type="button" id="import-btn" data-i18n="importConfig"></button>
          <input type="file" id="import-file" accept="application/json" hidden />
        </div>
      </form>

      <div id="result-banner" class="banner" hidden role="status"></div>
    </div>

    <dialog id="about-dialog" aria-labelledby="about-dialog-title">
      <div class="dialog-header">
        <h2 id="about-dialog-title" data-i18n="aboutTitle"></h2>
        <button type="button" id="about-close-btn" class="dialog-close" data-i18n-aria-label="aboutCloseLabel">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <p data-i18n="aboutDescription"></p>
      <p data-i18n="aboutHighLatitudeNote"></p>
      <dl class="about-meta">
        <div class="about-meta-row">
          <dt data-i18n="aboutVersionLabel"></dt>
          <dd>1.0.0</dd>
        </div>
        <div class="about-meta-row">
          <dt data-i18n="aboutMaintainerLabel"></dt>
          <dd>Mezdek Osman</dd>
        </div>
        <div class="about-meta-row">
          <dt data-i18n="aboutWebsiteLabel"></dt>
          <dd><a href="https://mezdek.net" target="_blank" rel="noopener noreferrer">mezdek.net</a></dd>
        </div>
        <div class="about-meta-row">
          <dt data-i18n="aboutEmailLabel"></dt>
          <dd><a href="mailto:hello@mezdek.net">hello@mezdek.net</a></dd>
        </div>
        <div class="about-meta-row">
          <dt data-i18n="aboutLicenseLabel"></dt>
          <dd>MIT</dd>
        </div>
        <div class="about-meta-row">
          <dt data-i18n="aboutRepositoryLabel"></dt>
          <dd>
            <a href="https://github.com/Mezdek/gebetszeiten-berechner" target="_blank" rel="noopener noreferrer"
              >github.com/Mezdek/gebetszeiten-berechner</a
            >
          </dd>
        </div>
      </dl>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
